<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo My Pet Brasil</title>
<meta name="description" content="Catálogo digital interativo da My Pet Brasil com preços de tabela e promoções.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://imagedelivery.net">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1A3472; --navy-dark: #0F1F45; --navy-soft: #EDF0F8;
    --green: #00A651; --green-dark: #068A47; --green-soft: #E3F5EC;
    --orange: #FF6A00; --promo: #E8530E;
    --ink: #0F1F45; --muted: #5A6580; --line: #DDE2EC;
    --paper: #FFFDF8; --paper-2: #F6F2EA;
    --desk: #E9ECF3; --desk-2: #D9DEEA;
    --chrome: rgba(255,255,255,.86); --chrome-line: rgba(15,31,69,.10); --chrome-ink: #0F1F45;
    --sans: "Geist", system-ui, -apple-system, Segoe UI, sans-serif;
    --serif: "Fraunces", Georgia, serif;
    --u: 4.4px; --pw: 440px; --ph: 586px; --flip: 850ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --desk: #0B1430; --desk-2: #060C20; --chrome: rgba(15,31,69,.82); --chrome-line: rgba(255,255,255,.10); --chrome-ink: #fff; }
  }
  :root[data-theme="dark"] { --desk: #0B1430; --desk-2: #060C20; --chrome: rgba(15,31,69,.82); --chrome-line: rgba(255,255,255,.10); --chrome-ink: #fff; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--sans); color: var(--ink); background: radial-gradient(120% 90% at 50% 40%, var(--desk) 0%, var(--desk-2) 100%); overflow: hidden; -webkit-font-smoothing: antialiased; touch-action: pan-y; }
  button { font: inherit; color: inherit; cursor: pointer; }
  img { display: block; max-width: 100%; }

  /* ---------- barra superior ---------- */
  .topbar { position: fixed; inset: 0 0 auto 0; height: 60px; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--chrome); backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--chrome-line); color: var(--chrome-ink); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--green); color: #fff; font-size: 18px; box-shadow: 0 4px 12px rgba(0,166,81,.35); }
  .brand small { display: block; font-weight: 500; font-size: 12px; opacity: .65; }
  .spacer { flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; width: min(340px, 32vw); border-radius: 999px; border: 1px solid var(--chrome-line); background: rgba(127,140,170,.10); }
  .search input { border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; width: 100%; }
  .search input::placeholder { color: inherit; opacity: .55; }
  .tb-btn { height: 38px; min-width: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--chrome-line); background: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; transition: background .18s, transform .12s; }
  .tb-btn:hover { background: rgba(127,140,170,.16); }
  .tb-btn:active { transform: scale(.96); }
  .tb-btn.primary { background: var(--green); color: #fff; border-color: transparent; }
  .tb-btn.primary:hover { background: var(--green-dark); }
  .tb-btn.promo { background: var(--promo); color: #fff; border-color: transparent; }
  .tb-btn svg { width: 18px; height: 18px; }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #fff; color: var(--green-dark); font-size: 12px; font-weight: 800; display: inline-grid; place-items: center; }
  .badge.bump { animation: bump .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bump { 40% { transform: scale(1.5) } }

  /* ---------- livro ---------- */
  .stage { position: fixed; inset: 60px 0 64px 0; display: grid; place-items: center; perspective: 2600px; }
  .book { position: relative; width: calc(var(--pw) * 2); height: var(--ph); transform-style: preserve-3d; transition: transform var(--flip) cubic-bezier(.645,.045,.355,1); }
  .book.single { width: var(--pw); }
  .book::before { content: ""; position: absolute; inset: 0; border-radius: 6px; box-shadow: 0 30px 60px -10px rgba(10,20,50,.45), 0 12px 24px -8px rgba(10,20,50,.3); z-index: -1; transition: inset var(--flip); }
  .book.closed-left::before { inset: 0 0 0 50%; }
  .book.closed-right::before { inset: 0 50% 0 0; }
  .book.single::before { inset: 0; }
  .slot { position: absolute; top: 0; width: var(--pw); height: var(--ph); }
  .slot.L { left: 0; } .slot.R { left: var(--pw); }
  .book.single .slot.L { display: none; } .book.single .slot.R { left: 0; }
  .slot.empty { pointer-events: none; }
  .leaf { position: absolute; top: 0; width: var(--pw); height: var(--ph); z-index: 10; transform-style: preserve-3d; transition: transform var(--flip) cubic-bezier(.645,.045,.355,1); will-change: transform; }
  .leaf.fwd { left: var(--pw); transform-origin: left center; }
  .leaf.back { left: 0; transform-origin: right center; }
  .book.single .leaf.fwd, .book.single .leaf.sback { left: 0; transform-origin: left center; }
  .leaf .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .leaf .face.b { transform: rotateY(180deg); }
  .leaf .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0) 40%, rgba(255,255,255,.12) 70%, rgba(0,0,0,.08)); }
  .leaf.turning .face::after { animation: shade var(--flip) ease-in-out; }
  @keyframes shade { 50% { opacity: 1 } }
  .book.single .leaf .face.b { background: var(--paper-2); }

  /* ---------- página ---------- */
  .page { position: absolute; inset: 0; overflow: hidden; background: var(--paper); color: var(--ink); font-size: calc(var(--u) * 3.2); line-height: 1.45; }
  .page.left { border-radius: 6px 0 0 6px; } .page.right { border-radius: 0 6px 6px 0; }
  .book.single .page { border-radius: 6px; }
  .page::after { content: ""; position: absolute; top: 0; bottom: 0; width: 7%; pointer-events: none; z-index: 5; }
  .page.left::after { right: 0; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.10) 70%, rgba(0,0,0,.2)); }
  .page.right::after { left: 0; background: linear-gradient(270deg, rgba(0,0,0,0), rgba(0,0,0,.08) 70%, rgba(0,0,0,.18)); }
  .book.single .page::after { display: none; }
  .pad { position: absolute; inset: calc(var(--u)*7) calc(var(--u)*8) calc(var(--u)*10); display: flex; flex-direction: column; }
  .folio { position: absolute; bottom: calc(var(--u)*3.6); font-size: calc(var(--u)*2.2); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; z-index: 6; white-space: nowrap; }
  .page.left .folio { left: calc(var(--u)*8); } .page.right .folio, .book.single .page .folio { right: calc(var(--u)*8); left: auto; }
  .folio b { color: var(--ink); }
  .eyebrow { font-size: calc(var(--u)*2.3); letter-spacing: .18em; text-transform: uppercase; font-weight: 700; }
  .corner { position: absolute; bottom: 0; width: calc(var(--u)*10); height: calc(var(--u)*10); z-index: 8; border: 0; padding: 0; background: transparent; opacity: 0; transition: opacity .25s; }
  .corner::before { content: ""; position: absolute; inset: 0; transition: transform .3s cubic-bezier(.3,1.4,.5,1); transform: scale(.5); }
  .page.right .corner, .book.single .page .corner { right: 0; left: auto; }
  .page.right .corner::before, .book.single .page .corner::before { background: linear-gradient(315deg, transparent 50%, rgba(0,0,0,.08) 50%, #fff 58%, #ECE6DA 100%); transform-origin: right bottom; border-top-left-radius: 4px; }
  .page.left .corner { left: 0; }
  .page.left .corner::before { background: linear-gradient(45deg, transparent 50%, rgba(0,0,0,.08) 50%, #fff 58%, #ECE6DA 100%); transform-origin: left bottom; border-top-right-radius: 4px; }
  .slot:hover .corner { opacity: 1; }
  .corner:hover::before { transform: scale(1); }

  /* entrada animada (só na página revelada) */
  .live .a-up { animation: up .7s cubic-bezier(.2,.8,.2,1) both; }
  .live .a-pop { animation: pop .9s cubic-bezier(.2,1.2,.3,1) both; }
  .live .a-fade { animation: fade .9s ease both; }
  .live .d1 { animation-delay: calc(var(--flip) * .4); } .live .d2 { animation-delay: calc(var(--flip) * .5); }
  .live .d3 { animation-delay: calc(var(--flip) * .6); } .live .d4 { animation-delay: calc(var(--flip) * .7); }
  .live .d5 { animation-delay: calc(var(--flip) * .8); }
  .live .cards4 .card { animation: up .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--flip) * .45 + var(--k) * 80ms); }
  @keyframes up { from { opacity: 0; transform: translateY(calc(var(--u)*4)); } }
  @keyframes pop { from { opacity: 0; transform: translateY(calc(var(--u)*6)) scale(.9) rotate(-3deg); } }
  @keyframes fade { from { opacity: 0 } }

  /* capa */
  .cover { background: radial-gradient(120% 80% at 70% 30%, #24468F 0%, var(--navy) 45%, var(--navy-dark) 100%); color: #fff; }
  .cover .glow { position: absolute; width: 90%; aspect-ratio: 1; left: 5%; top: 16%; border-radius: 50%; background: radial-gradient(circle, rgba(0,166,81,.55), rgba(0,166,81,0) 65%); filter: blur(calc(var(--u)*2)); }
  .cover .logo { display: flex; align-items: center; gap: calc(var(--u)*2); font-weight: 800; font-size: calc(var(--u)*3.4); position: relative; z-index: 2; }
  .cover .logo i { font-style: normal; width: calc(var(--u)*7); height: calc(var(--u)*7); border-radius: calc(var(--u)*2); display: grid; place-items: center; background: var(--green); font-size: calc(var(--u)*3.8); }
  .cover .edition { margin-left: auto; font-size: calc(var(--u)*2.2); letter-spacing: .2em; text-transform: uppercase; opacity: .7; font-weight: 600; }
  .cover h1 { font-family: var(--serif); font-weight: 500; font-size: calc(var(--u)*13); line-height: .92; letter-spacing: -.03em; margin: auto 0 0; position: relative; z-index: 2; }
  .cover h1 em { display: block; font-style: italic; font-weight: 400; color: #7CF0B0; }
  .mosaic { position: absolute; left: 50%; top: 13%; width: 80%; aspect-ratio: 1.3; margin-left: -40%; z-index: 1; animation: float 6s ease-in-out infinite; }
  .mosaic span { position: absolute; width: 40%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #F3F6FC 60%, #DDE5F5 70%, rgba(221,229,245,0) 71%); display: grid; place-items: center; padding: 9%; overflow: hidden; box-shadow: 0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.25); }
  .mosaic span img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  .mosaic span:nth-child(1) { left: 0; top: 4%; } .mosaic span:nth-child(2) { right: 0; top: 0; width: 44%; }
  .mosaic span:nth-child(3) { left: 16%; bottom: 0; width: 34%; } .mosaic span:nth-child(4) { right: 8%; bottom: 4%; width: 32%; }
  @keyframes float { 50% { transform: translateY(calc(var(--u)*-2)) } }
  .cover .meta { display: flex; gap: calc(var(--u)*2); margin-top: calc(var(--u)*4); font-size: calc(var(--u)*2.5); position: relative; z-index: 2; flex-wrap: wrap; }
  .cover .meta span { padding: calc(var(--u)*1) calc(var(--u)*2.4); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; }
  .cover .meta span.hot { background: var(--promo); border-color: var(--promo); font-weight: 700; }
  .open-hint { position: absolute; right: calc(var(--u)*8); bottom: calc(var(--u)*4); font-size: calc(var(--u)*2.3); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; z-index: 3; animation: nudge 1.8s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(calc(var(--u)*1.5)) } }

  /* intro / sumário / como comprar */
  .intro h2, .toc h2, .how h2 { font-family: var(--serif); font-weight: 500; font-size: calc(var(--u)*8); line-height: 1; letter-spacing: -.02em; margin: calc(var(--u)*3) 0 calc(var(--u)*4); color: var(--navy); }
  .intro h2 em { color: var(--green); }
  .intro p { margin: 0 0 calc(var(--u)*3); color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(var(--u)*2.4); margin: calc(var(--u)*2) 0 auto; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: calc(var(--u)*2.4); padding: calc(var(--u)*2.6) calc(var(--u)*2.8); }
  .stat b { display: block; font-family: var(--serif); font-size: calc(var(--u)*7.4); line-height: 1; color: var(--navy); }
  .stat.hot b { color: var(--promo); }
  .stat span { font-size: calc(var(--u)*2.4); color: var(--muted); line-height: 1.25; display: block; margin-top: calc(var(--u)*1); }
  .howto { border-top: 1px solid var(--line); padding-top: calc(var(--u)*3); display: grid; gap: calc(var(--u)*1.6); font-size: calc(var(--u)*2.6); }
  .howto div { display: flex; gap: calc(var(--u)*2.4); align-items: center; }
  .howto kbd { min-width: calc(var(--u)*9); text-align: center; font-family: var(--sans); font-size: calc(var(--u)*2.2); font-weight: 700; padding: calc(var(--u)*.8) calc(var(--u)*1.4); border-radius: calc(var(--u)*1.2); background: var(--navy-soft); color: var(--navy); }
  .toc h2 { margin-bottom: calc(var(--u)*2); }
  .toc-item { display: grid; grid-template-columns: calc(var(--u)*6.4) 1fr auto; align-items: center; gap: calc(var(--u)*2); width: 100%; padding: calc(var(--u)*1.05) 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; transition: padding .25s; }
  .toc-item:hover { padding-left: calc(var(--u)*1.4); }
  .toc-ic { width: calc(var(--u)*6.4); height: calc(var(--u)*6.4); border-radius: 50%; display: grid; place-items: center; background: var(--tint); font-size: calc(var(--u)*3.2); }
  .toc-name { font-weight: 700; font-size: calc(var(--u)*2.8); color: var(--ink); line-height: 1.15; }
  .toc-name small { display: block; font-weight: 500; font-size: calc(var(--u)*2.2); color: var(--muted); margin-top: calc(var(--u)*.4); }
  .toc-pg { font-weight: 700; font-size: calc(var(--u)*2.6); color: var(--c); }
  .grid-cta { margin-top: auto; align-self: flex-start; border: 0; background: var(--navy); color: #fff; font-weight: 700; font-size: calc(var(--u)*2.7); padding: calc(var(--u)*2) calc(var(--u)*3.6); border-radius: 999px; }
  .step { display: grid; grid-template-columns: calc(var(--u)*10) 1fr; gap: calc(var(--u)*2.4); margin-bottom: calc(var(--u)*3.6); }
  .step i { font-style: normal; width: calc(var(--u)*10); height: calc(var(--u)*10); border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green-dark); font-family: var(--serif); font-size: calc(var(--u)*5); }
  .step b { display: block; font-size: calc(var(--u)*3.3); margin-bottom: calc(var(--u)*.6); }
  .step span { color: var(--muted); font-size: calc(var(--u)*2.7); }
  .list-box { margin-top: auto; background: var(--navy); color: #fff; border-radius: calc(var(--u)*3); padding: calc(var(--u)*3.6); display: flex; align-items: center; gap: calc(var(--u)*3); }
  .list-box b { font-family: var(--serif); font-size: calc(var(--u)*8.5); line-height: 1; }
  .list-box span { flex: 1; font-size: calc(var(--u)*2.6); opacity: .85; }
  .list-box button { border: 0; border-radius: 999px; background: var(--green); color: #fff; font-weight: 700; font-size: calc(var(--u)*2.6); padding: calc(var(--u)*2) calc(var(--u)*3.2); }

  /* abertura de capítulo */
  .opener { background: var(--bg); color: #fff; }
  .opener .big-ic { position: absolute; right: -8%; top: -4%; font-size: calc(var(--u)*56); line-height: 1; opacity: .12; filter: grayscale(.3); }
  .opener h2 { font-family: var(--serif); font-weight: 500; font-size: calc(var(--u)*8.6); line-height: .95; letter-spacing: -.03em; margin: calc(var(--u)*2.4) 0 calc(var(--u)*3); }
  .opener h2 em { display: block; font-weight: 400; color: var(--accent); font-size: .62em; margin-top: calc(var(--u)*1.4); }
  .opener .subs { display: grid; gap: 0; border-top: 1px solid rgba(255,255,255,.25); }
  .opener .subs button { display: flex; justify-content: space-between; align-items: baseline; gap: calc(var(--u)*2); border: 0; border-bottom: 1px solid rgba(255,255,255,.2); background: none; color: #fff; padding: calc(var(--u)*1.25) 0; font-size: calc(var(--u)*2.6); font-weight: 600; text-align: left; transition: padding .2s; }
  .opener .subs button:hover { padding-left: calc(var(--u)*1.2); }
  .opener .subs button span { opacity: .7; font-size: .85em; white-space: nowrap; }
  .collage { position: relative; margin-top: auto; height: 30%; }
  .collage img { position: absolute; width: 46%; aspect-ratio: 1; object-fit: contain; border-radius: calc(var(--u)*2.4); background: #fff; padding: calc(var(--u)*2); box-shadow: 0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.3); }
  .collage img:nth-child(1) { left: -2%; bottom: 10%; transform: rotate(-7deg); }
  .collage img:nth-child(2) { left: 27%; bottom: 0; z-index: 3; transform: rotate(1deg); }
  .collage img:nth-child(3) { right: -2%; bottom: 16%; transform: rotate(6deg); z-index: 2; }
  .opener .count { position: absolute; right: calc(var(--u)*8); top: calc(var(--u)*7); font-size: calc(var(--u)*2.3); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: calc(var(--u)*1) calc(var(--u)*2.4); border-radius: 999px; background: rgba(255,255,255,.16); }
  .opener .folio, .opener .folio b { color: #fff; opacity: .75; }

  /* páginas de produtos: grade 2×2 */
  .plist .pad { inset: calc(var(--u)*5.5) calc(var(--u)*5.5) calc(var(--u)*8.5); }
  .p-head { display: flex; justify-content: space-between; align-items: baseline; gap: calc(var(--u)*2); color: var(--c); margin-bottom: calc(var(--u)*1.8); }
  .p-head .eyebrow { display: flex; align-items: center; gap: calc(var(--u)*1.2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-head .dot { width: calc(var(--u)*1.5); height: calc(var(--u)*1.5); border-radius: 50%; background: var(--c); flex: none; }
  .p-head .subname { font-size: calc(var(--u)*2.2); color: var(--muted); font-weight: 600; white-space: nowrap; }
  .sec-title { font-family: var(--serif); font-weight: 500; font-size: calc(var(--u)*5.4); line-height: 1.02; letter-spacing: -.02em; color: var(--navy); margin: 0 0 calc(var(--u)*2.4); }
  .sec-title small { font-family: var(--sans); font-size: calc(var(--u)*2.1); font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: calc(var(--u)*1.2); }
  .sec-cont { font-size: calc(var(--u)*2.2); font-weight: 700; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 calc(var(--u)*1.6); }
  .cards4 { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: calc(var(--u)*2.2); min-height: 0; }
  .card { position: relative; border: 1px solid var(--line); background: #fff; border-radius: calc(var(--u)*2.6); padding: 0; text-align: left; display: flex; flex-direction: column; overflow: hidden; min-height: 0; transition: transform .2s, box-shadow .2s, border-color .2s; }
  .card:hover { transform: translateY(calc(var(--u)*-.8)); box-shadow: 0 calc(var(--u)*2.4) calc(var(--u)*4) rgba(15,31,69,.14); border-color: var(--c); }
  .c-img { position: relative; flex: 0 0 56%; background: radial-gradient(70% 70% at 50% 55%, #fff, var(--tint)); overflow: hidden; }
  .c-img img { position: absolute; inset: 7%; width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; }
  .c-img .ph { position: absolute; inset: 0; }
  .ph { display: grid; place-items: center; text-align: center; color: var(--c); font-size: calc(var(--u)*1.8); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .8; gap: calc(var(--u)*.6); }
  .ph i { font-style: normal; font-size: calc(var(--u)*7); line-height: 1; filter: grayscale(.2); opacity: .7; }
  .c-off { position: absolute; top: calc(var(--u)*1.2); left: calc(var(--u)*1.2); background: var(--promo); color: #fff; border-radius: 999px; font-size: calc(var(--u)*1.9); font-weight: 800; padding: calc(var(--u)*.4) calc(var(--u)*1.4); z-index: 2; }
  .c-nv { position: absolute; top: calc(var(--u)*1.2); right: calc(var(--u)*1.2); background: rgba(255,255,255,.92); color: var(--c); border-radius: 999px; font-size: calc(var(--u)*1.8); font-weight: 800; padding: calc(var(--u)*.4) calc(var(--u)*1.3); z-index: 2; box-shadow: 0 1px 4px rgba(0,0,0,.1); }

  if (g.variants.length === 1) return `<div class="c-var">Ref. ${esc(g.variants[0].ref)}${g.brand ? " · " + esc(g.brand) : ""}</div>`;

  if (g.vers.length > 1) {
    const lbl = g.axes.verLabel === "Cor" ? "cores" : g.axes.verLabel === "Modelo" ? "modelos" : "versões";
    parts.push(`<b>${g.vers.length} ${lbl}</b>${g.sizes.length > 1 ? "" : " · " + esc(g.vers.slice(0, 3).join(", ")) + (g.vers.length > 3 ? "…" : "")}`);
  }
  return `<div class="c-var">${parts.join(" · ")}</div>`;
}
function priceSummary(g) {
  if (g.variants.length === 1) {

    return v.promo ? `<div class="c-price promo"><s>${brl(v.tab)}</s><span class="pv">${brl(v.promo)}</span></div>`

  const from = g.min !== g.max ? `<span class="from">a partir de</span>` : "";
  return `<div class="c-price ${g.promo ? "promo" : ""}">${from}<span class="pv">${brl(g.min)}</span></div>`;

   ===================================================================== */
const book = document.getElementById("book"), slotL = document.getElementById("slotL"), slotR = document.getElementById("slotR");
const prevBtn = document.getElementById("prev"), nextBtn = document.getElementById("next");
let single = false, cur = 0, busy = false;
const spreadCount = () => single ? N : Math.floor(N / 2) + 1;

}

function setSlot(slot, i, animate) {

  slot.classList.remove("live");

    c.className = "corner"; c.setAttribute("aria-hidden", "true"); c.tabIndex = -1;

}
function applyBookShift(s) {

  if (single) { book.style.transform = ""; return; }
  const { L, R } = pagesOf(s);
  if (L == null) { book.classList.add("closed-left"); book.style.transform = "translateX(calc(var(--pw) * -0.5))"; }
  else if (R == null) { book.classList.add("closed-right"); book.style.transform = "translateX(calc(var(--pw) * 0.5))"; }

}
function render(animate = true) {
  const { L, R } = pagesOf(cur);
  setSlot(slotL, L, false); setSlot(slotR, R, animate);

}

}
function makeLeaf(cls, front, frontSide, back, backSide) {

}
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  busy = true;
  let leaf;

  else if (!single) { setSlot(slotL, b.L, true); leaf = makeLeaf("back", a.L, "left", b.R, "right"); }
  else if (fwd) { setSlot(slotR, b.R, true); leaf = makeLeaf("fwd", a.R, "right", null); }

    if (!leaf.isConnected) return;

    else if (!single) setSlot(slotR, b.R, false);
    else if (!fwd) setSlot(slotR, b.R, false);

  setTimeout(done, 1300);
}
const next = () => flipTo(cur + 1), prev = () => flipTo(cur - 1), goPage = (i) => flipTo(spreadOfPage(i));

let ready = false;
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight, wasSingle = single;
  single = vw < 860;
  const availH = vh - 60 - 64 - (single ? 24 : 48), availW = single ? vw - 32 : vw - 160;
  const ratio = single ? Math.max(0.62, Math.min(0.75, availW / availH)) : 0.75;
  let ph = availH, pw = ph * ratio;
  const maxW = single ? availW : availW / 2;
  if (pw > maxW) { pw = maxW; ph = pw / ratio; }
  pw = Math.floor(pw); ph = Math.floor(ph);
  const st = document.documentElement.style;
  st.setProperty("--pw", pw + "px"); st.setProperty("--ph", ph + "px"); st.setProperty("--u", (pw / 100) + "px");
  book.classList.toggle("single", single);
  if (wasSingle !== single && ready) { cur = single ? Math.min(N - 1, cur * 2) : spreadOfPage(cur); render(false); }
}

const track = document.getElementById("track"), pgLabel = document.getElementById("pgLabel");
function buildTrack() {
  track.innerHTML = PAGES.map((p, i) => `<button class="tick" data-go="${i}" style="--c:${p.c || "#9CA8C0"}" aria-label="Ir para ${esc(p.title)}"><span class="tip">${i ? "p. " + i + " · " : ""}${esc(p.title)}</span></button>`).join("");

  const vis = [L, R].filter(v => v != null);
  track.querySelectorAll(".tick.on").forEach(t => t.classList.remove("on"));
  vis.forEach(i => track.children[i]?.classList.add("on"));

let filter = "all", query = "", gridLimit = 60;

function renderCards() {
  const fs = [["all", `Todos (${GROUPS.length})`], ["promo", `% Promoções (${PROMO_GROUPS.length})`], ...chapters.map(c => [c.key, `${chOf(c.key).ic} ${c.key}`])];

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-open],[data-q],[data-qty],[data-ver],[data-go],[data-grid],[data-open-list],[data-filter],[data-turn],[data-close],[data-more]");
  if (!el) {
    if (e.target.closest("#shImg")) { const s = document.getElementById("shImg"); zoomMove(e); s.classList.toggle("zoomed"); return; }
    const slot = e.target.closest(".slot");
    if (slot && !e.target.closest("a,button")) (slot === slotL ? prev : next)();
    return;
  }
  if (el.dataset.open) return openSheet(el.dataset.open);
  if (el.dataset.q) { const r = el.dataset.q; return setQty(r, (list[r] || 0) + +el.dataset.d, el); }
  if (el.dataset.qty) { const r = el.dataset.qty; return setQty(r, (list[r] || 0) + +el.dataset.d); }
  if (el.dataset.ver != null) { verSel = el.dataset.ver; return renderRows(); }
  if (el.dataset.turn) return el.dataset.turn === "prev" ? prev() : next();
  if (el.dataset.go != null) { closeAll(); return goPage(+el.dataset.go); }
  if (el.hasAttribute("data-grid")) return openGrid("all");
  if (el.hasAttribute("data-open-list")) return openList();
  if (el.hasAttribute("data-close")) return closeAll();

  if (el.dataset.filter) { filter = el.dataset.filter; gridLimit = 60; return renderCards(); }
});

document.addEventListener("keydown", (e) => {

  else if (e.key === "Home") flipTo(0);
  else if (e.key === "End") flipTo(spreadCount() - 1);
  else if (e.key.toLowerCase() === "f") toggleFull();
});
let tx = null, ty = null;
const stage = document.getElementById("stage");
stage.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
stage.addEventListener("touchend", (e) => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? next : prev)();
  tx = null;
});
window.addEventListener("resize", layout);
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#p(\d+)$/); if (m) goPage(Math.min(N - 1, +m[1])); });

/* ---------- início ---------- */
document.getElementById("brandSub").textContent = `Catálogo digital · tabela ${DATA.tableDate}`;
document.getElementById("stamp").textContent = `Tabela ${DATA.tableDate}`;
layout(); ready = true;
buildTrack();
const start = location.hash.match(/^#p(\d+)$/);
cur = start ? spreadOfPage(Math.min(N - 1, +start[1])) : 0;
render(true);
refreshList(false, false);
</script>
</body>
